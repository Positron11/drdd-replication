[build-system]
requires = [
	"setuptools>=64",
	"wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "drdd-replication"
version = "0.1.0"
description = "Replication package for 'Dr. DD: 1-Minimal Isolation of Failure Causes via Deferred Restarts' (ISSRE 2026)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
	{ name = "Aarush Kumbhakern",     email = "aarush.kumbhakern_ug25@ashoka.edu.in" },
	{ name = "Feiyang Chen",          email = "fche0060@uni.sydney.edu.au" },
	{ name = "Danushka Liyanage",     email = "danushka.liyanage@sydney.edu.au" },
	{ name = "Xi Wu",                 email = "xi.wu@sydney.edu.au" },
	{ name = "Mohammad Amin Alipour", email = "maalipou@central.uh.edu" },
	{ name = "Rahul Gopinath",        email = "rahul.gopinath@sydney.edu.au" },
]
dependencies = [
	"defusedxml >= 0.7.1",    # xml/cherrypick (safe XML parsing)
	"saxonche   >= 12.9.0",   # xml driver (reference XQuery engine)
	"numpy      >= 1.24",     # probdd reducer (probability vectors)
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

